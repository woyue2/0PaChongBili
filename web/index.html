<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0PaChongBili 爬虫控制台</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --term-bg: #010409;
    --term-text: #7ee787;
    --term-dim: #3fb950;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .badge {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
  }
  header .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    display: inline-block;
  }
  main { display: flex; gap: 16px; padding: 16px 24px; align-items: flex-start; }
  .col-left { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; }
  .col-right { flex: 1; min-width: 0; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card h2 { font-size: 14px; margin-bottom: 12px; color: var(--muted); font-weight: 600; }

  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .form-row input, .form-row select {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  .form-row input:focus, .form-row select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .form-inline { display: flex; gap: 8px; }
  .form-inline .form-row { flex: 1; }
  .keyword-combo { position: relative; }
  .keyword-combo input { width: 100%; }
  .keyword-combo select { display: none; }
  .keyword-suggestions {
    display: none;
    position: absolute;
    z-index: 20;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 220px;
    overflow-y: auto;
    padding: 4px 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
  }
  .keyword-suggestions.open { display: block; }
  .keyword-suggestion {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 12px;
    color: var(--text);
    cursor: pointer;
  }
  .keyword-suggestion:hover, .keyword-suggestion.active { background: #21262d; }
  .keyword-suggestion-count { color: var(--muted); font-size: 12px; }

  button {
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #21262d; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    width: 100%;
  }
  button.primary:hover { background: #1f6feb; }
  button.danger { color: var(--red); border-color: var(--red); }
  button.danger:hover { background: rgba(248,81,73,.1); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* 任务列表 */
  .task-item {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .task-item:hover { border-color: var(--accent); }
  .task-item.active { border-color: var(--accent); background: rgba(47,129,247,.06); }
  .task-item .t-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .task-item .t-title { font-size: 13px; font-weight: 600; }
  .task-item .t-time { font-size: 11px; color: var(--muted); }
  .task-item .t-meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .task-item .t-progress { height: 3px; background: var(--bg); border-radius: 2px; overflow: hidden; }
  .task-item .t-progress .bar { height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  .status-pill {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid;
  }
  .status-running { color: var(--accent); border-color: var(--accent); }
  .status-starting { color: var(--yellow); border-color: var(--yellow); }
  .status-finished { color: var(--green); border-color: var(--green); }
  .status-failed { color: var(--red); border-color: var(--red); }
  .status-killed { color: var(--muted); border-color: var(--border); }

  .empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 24px 0;
  }

  /* 终端 */
  .terminal {
    background: var(--term-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: 12.5px;
    line-height: 1.55;
    height: calc(100vh - 160px);
    min-height: 400px;
    overflow-y: auto;
    padding: 12px 14px;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--term-text);
    position: relative;
  }
  .terminal::-webkit-scrollbar { width: 10px; }
  .terminal::-webkit-scrollbar-thumb { background: #30363d; border-radius: 5px; }
  .terminal .term-header {
    position: sticky; top: 0;
    background: var(--term-bg);
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 8px; margin-bottom: 8px;
    border-bottom: 1px solid #21262d;
    font-family: "Segoe UI", sans-serif;
    font-size: 12px;
    color: var(--muted);
  }
  .terminal .line { animation: fadeIn .12s ease; }
  .terminal .line.dim { color: var(--term-dim); }
  .terminal .line.red { color: var(--red); }
  .terminal .line.yellow { color: var(--yellow); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .terminal .cursor { display: inline-block; width: 8px; height: 14px; background: var(--term-text); animation: blink 1s step-end infinite; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }
  .term-actions { display: flex; gap: 8px; }
  .term-empty { color: var(--muted); }

  /* 页签 */
  .tabs {
    display: flex; gap: 4px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .tab {
    padding: 10px 18px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-weight: 500;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .view { display: none; }
  .view.active { display: block; }

  /* 概览页 */
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .kw-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .kw-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .kw-card .kw-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .kw-card .kw-name { font-size: 15px; font-weight: 700; }
  .kw-card .kw-count { font-size: 12px; color: var(--muted); }
  .kw-card .kw-dates { font-size: 12px; color: var(--accent); }
  .kw-card .kw-dates .date { margin-right: 6px; background: rgba(47,129,247,.12); padding: 1px 8px; border-radius: 10px; }
  .kw-card .kw-actions { margin-top: 10px; display: flex; gap: 8px; }
  .kw-card .kw-actions button { padding: 4px 12px; font-size: 12px; }
  .platform-header { margin: 18px 0 10px; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .platform-header:first-child { margin-top: 0; }

  /* 结果页（卡片，借鉴 OpenBiliClaw card-grid 风格） */
  .toolbar {
    display: flex; gap: 12px; align-items: flex-end;
    padding: 16px 0; flex-wrap: wrap;
  }
  .toolbar .form-row { margin-bottom: 0; min-width: 140px; }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .video-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .video-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  .vc-top { display: flex; justify-content: space-between; align-items: center; }
  .vc-rank {
    font-size: 22px; font-weight: 800;
    min-width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #1f6feb);
    color: #fff;
  }
  .vc-rank.top { background: linear-gradient(135deg, #f0b90b, #d29922); }
  .vc-platform {
    font-size: 11px; padding: 2px 10px; border-radius: 10px;
    background: rgba(47,129,247,.15); color: var(--accent);
  }
  .vc-title {
    font-size: 14px; font-weight: 600; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 40px;
  }
  .vc-title-link { color: inherit; text-decoration: none; }
  .vc-title-link:hover { color: var(--accent); text-decoration: underline; }
  .vc-meta { font-size: 12px; color: var(--muted); }
  .vc-stats { display: flex; gap: 12px; font-size: 12px; flex-wrap: wrap; }
  .vc-stat b { color: var(--text); }
  .vc-score-row { display: flex; align-items: center; gap: 8px; margin-top: auto; }
  .vc-score-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .vc-score-bar { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .vc-score-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #56d364); border-radius: 3px; }
  .vc-score-val { font-size: 13px; font-weight: 700; color: var(--green); min-width: 42px; text-align: right; }
  .vc-growth { font-size: 12px; font-weight: 600; }
  .vc-growth.up { color: var(--green); }
  .vc-growth.none { color: var(--muted); font-weight: 400; }
  .vc-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .vc-tag { font-size: 11px; padding: 1px 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
  .vc-link { font-size: 12px; color: var(--accent); text-decoration: none; }
  .vc-link:hover { text-decoration: underline; }
  .vc-detail-tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--border); margin-top: 4px; }
  .vc-detail-tab { border: 0; border-radius: 0; padding: 7px 0; background: transparent; color: var(--muted); font-size: 12px; border-bottom: 2px solid transparent; }
  .vc-detail-tab:hover { background: transparent; color: var(--text); }
  .vc-detail-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .vc-detail-panel { min-width: 0; }
  .vc-detail-panel.hidden { display: none; }
  .vc-history-track { display: flex; gap: 10px; overflow-x: auto; padding: 2px 1px 9px; cursor: grab; scroll-snap-type: x mandatory; scrollbar-color: var(--accent) transparent; }
  .vc-history-track.dragging { cursor: grabbing; scroll-snap-type: none; user-select: none; }
  .vc-snapshot { min-width: 210px; scroll-snap-align: start; background: var(--bg); border-left: 3px solid var(--accent); padding: 8px 10px; }
  .vc-snapshot-time { font-size: 11px; color: var(--muted); margin-bottom: 7px; }
  .vc-snapshot-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .vc-snapshot-action { border: 0; background: transparent; padding: 2px 4px; color: var(--muted); font-size: 11px; }
  .vc-snapshot-action:hover { background: transparent; color: var(--accent); }
  .vc-history-toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .vc-history-toolbar button { border: 0; background: transparent; padding: 3px 0; color: var(--accent); font-size: 11px; }
  .vc-history-toolbar button:hover { background: transparent; text-decoration: underline; }
  .vc-snapshot.hidden-day { display: none; opacity: .55; border-left-color: var(--muted); }
  .vc-history-panel.show-hidden .vc-snapshot.hidden-day { display: block; }
  .vc-snapshot.extra-point { display: none; }
  .vc-history-panel.show-all-points .vc-snapshot.extra-point { display: block; }
  .vc-metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 10px; }
  .vc-metric { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; }
  .vc-metric span { color: var(--muted); }
  .vc-detail-empty, .vc-drag-hint { color: var(--muted); font-size: 11px; padding: 7px 0; }
  .vc-algorithm { display: grid; gap: 8px; }
  .vc-factor { display: grid; grid-template-columns: 76px 1fr 74px; gap: 7px; align-items: center; font-size: 11px; }
  .vc-factor-name { color: var(--muted); }
  .vc-factor-bar { height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .vc-factor-fill { height: 100%; background: var(--accent); }
  .vc-factor-value { text-align: right; white-space: nowrap; }
  .no-data { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px 0; }

  /* 对比页 */
  .compare-bar { display: flex; gap: 12px; align-items: flex-end; padding: 16px 0; flex-wrap: wrap; }
  .compare-summary {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin: 12px 0;
  }
  .cmp-stat {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px;
  }
  .cmp-stat .num { font-size: 24px; font-weight: 800; }
  .cmp-stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cmp-stat.green .num { color: var(--green); }
  .cmp-stat.red .num { color: var(--red); }
  .cmp-stat.blue .num { color: var(--accent); }
  .cmp-group { margin-bottom: 22px; }
  .cmp-group h3 { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .cmp-group h3 .count-badge { font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 1px 10px; color: var(--muted); font-weight: 400; }
  .cmp-item {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .cmp-item .ci-main { min-width: 0; }
  .cmp-item .ci-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp-item .ci-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cmp-item .ci-value { text-align: right; flex-shrink: 0; }
  .cmp-item .ci-value .num { font-size: 14px; font-weight: 700; }
  .cmp-item.added { border-color: rgba(63,185,80,.4); }
  .cmp-item.added .num { color: var(--green); }
  .cmp-item.removed { opacity: .6; }
  .cmp-item.removed .num { color: var(--muted); }
  .cmp-item.changed .growth-up { color: var(--green); font-weight: 700; }
  .cmp-item.changed .growth-down { color: var(--red); font-weight: 700; }
  .cmp-item .ci-old { color: var(--muted); font-size: 12px; }
  .cmp-item .ci-arrow { color: var(--muted); margin: 0 4px; }
</style>
</head>
<body>

<header>
  <h1>🦞 0PaChongBili 爬虫控制台</h1>
  <span class="badge"><span class="status-dot" id="healthDot"></span> <span id="healthText">连接中...</span></span>
</header>

<div class="tabs">
  <button class="tab active" data-view="terminal" onclick="switchView('terminal')">🖥 终端</button>
  <button class="tab" data-view="overview" onclick="switchView('overview')">🗂 关键词概览</button>
  <button class="tab" data-view="results" onclick="switchView('results')">📊 结果排行</button>
  <button class="tab" data-view="compare" onclick="switchView('compare')">🔀 快照对比</button>
</div>

<!-- 终端视图 -->
<div class="view active" id="view-terminal">
<main>
  <div class="col-left">
    <!-- 新建任务 -->
    <div class="card">
      <h2>🚀 新建爬取任务</h2>
      <div class="form-row">
        <label>平台</label>
        <select id="platform">
          <option value="bili">B站</option>
          <option value="xhs">小红书</option>
          <option value="douyin">抖音</option>
          <option value="kuaishou">快手</option>
        </select>
      </div>
      <div class="form-row">
        <label>关键词</label>
        <div class="keyword-combo">
          <div id="keywordSuggestions" class="keyword-suggestions" role="listbox"></div>
          <input id="keyword" placeholder="输入新关键词" value="服饰">
        </div>
      </div>
      <div class="form-inline">
        <div class="form-row">
          <label>页数</label>
          <input id="pages" type="number" min="1" max="50" value="3">
        </div>
        <div class="form-row" id="modeRow" style="display:none;">
          <label>模式</label>
          <select id="mode">
            <option value="search">双分析</option>
            <option value="momentum">仅动量</option>
            <option value="value">仅价值</option>
          </select>
        </div>
      </div>
      <button class="primary" id="startBtn">▶ 开始爬取</button>
      <div class="hint">提示: 小红书/抖音/快手会弹出浏览器窗口，需要保持登录态；B站无需浏览器。</div>
    </div>

    <!-- 任务列表 -->
    <div class="card">
      <h2>📋 任务列表</h2>
      <div id="taskList"><div class="empty">暂无任务</div></div>
    </div>
  </div>

  <!-- 终端 -->
  <div class="col-right">
    <div class="terminal" id="terminal">
      <div class="term-header">
        <span id="termTitle">⬅ 选择左侧任务查看实时输出</span>
        <span class="term-actions">
          <button id="clearTerm" style="padding:3px 10px; font-size:12px;">清空</button>
          <button id="autoScrollBtn" style="padding:3px 10px; font-size:12px;">自动滚动: 开</button>
        </span>
      </div>
      <div id="termBody"><span class="term-empty">还没有选择任务。启动任务后，爬虫的 print 输出会实时显示在这里。</span></div>
    </div>
  </div>
</main>
</div>

<!-- 概览视图 -->
<div class="view" id="view-overview">
  <div style="padding: 16px 24px;">
    <div id="overviewContent"><div class="empty">加载中...</div></div>
  </div>
</div>

<!-- 结果视图 -->
<div class="view" id="view-results">
  <div style="padding: 0 24px;">
    <div class="toolbar">
      <div class="form-row">
        <label>平台</label>
        <select id="rPlatform">
          <option value="bili">B站</option>
          <option value="xhs">小红书</option>
          <option value="douyin">抖音</option>
          <option value="kuaishou">快手</option>
        </select>
      </div>
      <div class="form-row">
        <label>关键词</label>
        <select id="rKeyword"><option value="">先选平台</option></select>
      </div>
      <div class="form-row">
        <label>分析类型</label>
        <select id="rAnalysis">
          <option value="momentum">动量</option>
          <option value="value">价值</option>
        </select>
      </div>
      <button id="rLoadBtn">加载排行</button>
    </div>
    <div id="resultsContent"><div class="empty">选择平台和关键词后点击"加载排行"</div></div>
  </div>
</div>

<!-- 对比视图 -->
<div class="view" id="view-compare">
  <div style="padding: 0 24px;">
    <div class="compare-bar">
      <div class="form-row">
        <label>平台</label>
        <select id="cPlatform">
          <option value="bili">B站</option>
          <option value="xhs">小红书</option>
          <option value="douyin">抖音</option>
          <option value="kuaishou">快手</option>
        </select>
      </div>
      <div class="form-row">
        <label>关键词</label>
        <select id="cKeyword"><option value="">先选平台</option></select>
      </div>
      <div class="form-row">
        <label>快照 A（旧）</label>
        <select id="cSnapA"><option value="">先选关键词</option></select>
      </div>
      <div class="form-row">
        <label>快照 B（新）</label>
        <select id="cSnapB"><option value="">先选关键词</option></select>
      </div>
      <button id="cCompareBtn">开始对比</button>
    </div>
    <div id="compareContent"><div class="empty">选择平台、关键词和两个快照后点击"开始对比"。快照即每次爬取任务，可对比不同日期爬到的内容差异。</div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentTaskId = null;
let es = null;
let autoScroll = true;
let pollTimer = null;

// ---------- 工具 ----------
async function api(url, opts = {}) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function lineClass(text) {
  if (/\[(错误|失败|Error|Traceback|Exception)/.test(text)) return 'red';
  if (/\[(限流|警告|WARNING|中断)/.test(text)) return 'yellow';
  if (/^={5,}|^[-]{5,}|提示|说明/.test(text)) return 'dim';
  return '';
}

// ---------- 终端 ----------
function termAppend(text, cls = '') {
  const body = $('termBody');
  // 移除初始空态
  const empty = body.querySelector('.term-empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.textContent = text;
  body.appendChild(div);
  if (autoScroll) {
    const term = $('terminal');
    term.scrollTop = term.scrollHeight;
  }
  // 限制 DOM 行数，防止卡顿
  while (body.children.length > 3000) body.removeChild(body.firstChild);
}

function termStatus(text) {
  const body = $('termBody');
  const empty = body.querySelector('.term-empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'line dim';
  div.textContent = '── ' + text;
  body.appendChild(div);
  if (autoScroll) {
    const term = $('terminal');
    term.scrollTop = term.scrollHeight;
  }
}

// ---------- SSE 订阅 ----------
function subscribe(taskId) {
  if (es) { es.close(); es = null; }
  currentTaskId = taskId;
  const body = $('termBody');
  body.innerHTML = '<span class="term-empty">连接中...</span>';

  es = new EventSource(`/api/tasks/${taskId}/logs`);
  es.onmessage = e => termAppend(e.data, lineClass(e.data));
  es.addEventListener('done', e => {
    let status = 'finished';
    try { status = JSON.parse(e.data).status; } catch (_) {}
    termStatus(`[任务结束] 状态: ${status}`);
    es.close();
    es = null;
    refreshTasks();
  });
  es.onerror = () => {
    // EventSource 自动重连；仅当任务已结束时停止
    const task = tasksMap[currentTaskId];
    if (task && ['finished','failed','killed'].includes(task.status)) {
      es.close(); es = null;
    }
  };
}

// ---------- 任务列表 ----------
let tasksMap = {};
async function refreshTasks() {
  try {
    const tasks = await api('/api/tasks');
    tasksMap = {};
    const list = $('taskList');
    if (!tasks.length) {
      list.innerHTML = '<div class="empty">暂无任务</div>';
      return;
    }
    list.innerHTML = '';
    tasks.forEach(t => {
      tasksMap[t.id] = t;
      const item = document.createElement('div');
      item.className = 'task-item' + (t.id === currentTaskId ? ' active' : '');
      const isRunning = t.status === 'running' || t.status === 'starting';
      item.innerHTML = `
        <div class="t-head">
          <span class="t-title">[${t.platform_name}] ${escapeHtml(t.keyword)}</span>
          <span class="status-pill status-${t.status}">${statusText(t.status)}</span>
        </div>
        <div class="t-meta">页数: ${t.pages} · ${t.mode || '-'} · ${fmtTime(t.created_at)} · ${t.line_count} 行</div>
        ${isRunning ? '<div class="t-progress"><div class="bar" style="animation: pulse 1.2s infinite;"></div></div>' : ''}
      `;
      item.onclick = () => { subscribe(t.id); refreshTasks(); };
      list.appendChild(item);
    });
  } catch (e) {
    $('taskList').innerHTML = `<div class="empty">加载失败: ${escapeHtml(e.message)}</div>`;
  }
}

function statusText(s) {
  return {starting:'启动中', running:'运行中', finished:'已完成', failed:'失败', killed:'已停止'}[s] || s;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtNum(n) {
  if (n === null || n === undefined) return '-';
  n = Number(n);
  if (!isFinite(n)) return '-';
  if (n >= 1e8) return (n/1e8).toFixed(2) + '亿';
  if (n >= 1e4) return (n/1e4).toFixed(1) + '万';
  return n.toLocaleString('zh-CN');
}

function fmtDate(s) {
  if (!s) return '';
  return String(s).slice(0, 10);
}

function fmtDateTime(s) {
  if (!s) return '';
  return String(s).slice(0, 16).replace('T', ' ');
}

function renderHistory(history, hiddenDays, platform, videoId) {
  if (!history || !history.length) return '<div class="vc-detail-empty">暂无历史采集指标</div>';
  const hidden = new Set(hiddenDays || []);
  const byDay = {};
  history.forEach(snap => { const day = String(snap.record_time || '').slice(0, 10); (byDay[day] ||= []).push(snap); });
  const visibleDays = Object.keys(byDay).filter(day => !hidden.has(day)).length;
  const snapshots = Object.entries(byDay).flatMap(([day, points]) => points.map((snap, pointIndex) => `
    <div class="vc-snapshot ${hidden.has(day) ? 'hidden-day' : ''} ${pointIndex < points.length - 1 ? 'extra-point' : ''}">
      <div class="vc-snapshot-head">
        <div class="vc-snapshot-time">${escapeHtml(fmtDateTime(snap.record_time))}${points.length > 1 ? ` · 当天${pointIndex + 1}/${points.length}` : ''}</div>
        <button class="vc-snapshot-action" data-platform="${escapeHtml(platform)}" data-video-id="${escapeHtml(videoId)}" data-record-date="${day}" data-hidden="${hidden.has(day) ? 'false' : 'true'}">${hidden.has(day) ? '恢复' : '隐藏当天'}</button>
      </div>
      <div class="vc-metric-grid">${(snap.metrics || []).map(metric => `
        <div class="vc-metric"><span>${escapeHtml(metric.label)}</span><b>${fmtNum(metric.value)}</b></div>`).join('')}
      </div>
    </div>`)).join('');
  const multiPointDays = Object.values(byDay).filter(points => points.length > 1).length;
  return `<div class="vc-history-panel">
    <div class="vc-history-toolbar">
      ${hidden.size ? `<button class="vc-toggle-hidden">显示已隐藏 (${hidden.size})</button>` : ''}
      ${multiPointDays ? `<button class="vc-toggle-points">展开当天全部采集 (${multiPointDays}天)</button>` : ''}
      <span class="vc-drag-hint">默认 ${visibleDays} 天，每天显示最新一次</span>
    </div>
    <div class="vc-history-track">${snapshots}</div><div class="vc-drag-hint">横向滚动或按住拖动查看</div>
  </div>`;
}

function renderAlgorithm(factors) {
  if (!factors || !factors.length) return '<div class="vc-detail-empty">该分析暂无算法明细</div>';
  return `<div class="vc-algorithm">${factors.map(factor => {
    const value = Number(factor.value || 0);
    const width = Math.max(0, Math.min(100, value * 100));
    return `<div class="vc-factor">
      <span class="vc-factor-name">${escapeHtml(factor.label)}</span>
      <div class="vc-factor-bar"><div class="vc-factor-fill" style="width:${width}%"></div></div>
      <span class="vc-factor-value">${value.toFixed(3)} × ${Math.round(Number(factor.weight || 0) * 100)}%</span>
    </div>`;
  }).join('')}</div>`;
}

function initResultCardDetails(container) {
  container.querySelectorAll('.video-card').forEach(card => {
    card.querySelectorAll('.vc-detail-tab').forEach(tab => tab.onclick = () => {
      card.querySelectorAll('.vc-detail-tab').forEach(t => t.classList.toggle('active', t === tab));
      card.querySelectorAll('.vc-detail-panel').forEach(panel => panel.classList.toggle('hidden', panel.dataset.panel !== tab.dataset.target));
    });
    const historyPanel = card.querySelector('.vc-history-panel');
    const hiddenToggle = card.querySelector('.vc-toggle-hidden');
    if (hiddenToggle) hiddenToggle.onclick = () => {
      historyPanel.classList.toggle('show-hidden');
      hiddenToggle.textContent = historyPanel.classList.contains('show-hidden') ? '隐藏已隐藏数据' : hiddenToggle.textContent.replace('隐藏已隐藏数据', '显示已隐藏');
    };
    const pointsToggle = card.querySelector('.vc-toggle-points');
    if (pointsToggle) pointsToggle.onclick = () => {
      historyPanel.classList.toggle('show-all-points');
      pointsToggle.textContent = historyPanel.classList.contains('show-all-points') ? '收起当天重复采集' : '展开当天全部采集';
    };
    card.querySelectorAll('.vc-snapshot-action').forEach(button => button.onclick = async e => {
      e.stopPropagation();
      button.disabled = true;
      try {
        await api('/api/history-visibility', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
          platform: button.dataset.platform, video_id: button.dataset.videoId,
          record_date: button.dataset.recordDate, hidden: button.dataset.hidden === 'true'
        })});
        await loadResults();
      } catch (error) { alert('保存显示设置失败: ' + error.message); button.disabled = false; }
    });
    const track = card.querySelector('.vc-history-track');
    if (!track) return;
    let dragging = false, startX = 0, startScroll = 0;
    track.onpointerdown = e => { dragging = true; startX = e.clientX; startScroll = track.scrollLeft; track.classList.add('dragging'); track.setPointerCapture(e.pointerId); };
    track.onpointermove = e => { if (dragging) track.scrollLeft = startScroll - (e.clientX - startX); };
    const stop = () => { dragging = false; track.classList.remove('dragging'); };
    track.onpointerup = stop;
    track.onpointercancel = stop;
  });
}

// ---------- 页签切换 ----------
function switchView(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  if (name === 'overview' && !overviewLoaded) loadOverview();
  if (name === 'results' && !resultsLoaded) { loadResultKeywords(); resultsLoaded = true; }
  if (name === 'compare' && !compareLoaded) { loadCompareKeywords(); compareLoaded = true; }
}
let overviewLoaded = false;
let resultsLoaded = false;
let compareLoaded = false;

// ---------- 概览页 ----------
async function loadOverview() {
  const el = $('overviewContent');
  el.innerHTML = '<div class="empty">加载中...</div>';
  try {
    const data = await api('/api/analyses');
    let html = '';
    for (const [platform, info] of Object.entries(data)) {
      html += `<div class="platform-header">${escapeHtml(info.name)} <span style="font-size:12px;color:var(--muted);font-weight:400;">${info.keywords.length} 个关键词</span></div>`;
      if (!info.keywords.length) {
        html += '<div class="empty">暂无数据</div>';
        continue;
      }
      html += '<div class="overview-grid">';
      for (const kw of info.keywords) {
        const dates = kw.dates.map(d => `<span class="date">${d}</span>`).join('');
        html += `
          <div class="kw-card" data-platform="${platform}" data-keyword="${escapeHtml(kw.keyword)}">
            <div class="kw-head">
              <span class="kw-name">${escapeHtml(kw.keyword)}</span>
              <span class="kw-count">${kw.task_count} 任务 · ${kw.done_count} 完成</span>
            </div>
            <div class="kw-dates">${dates}</div>
            <div class="kw-actions">
              <button class="ov-results">📊 看排行</button>
              <button class="ov-compare">🔀 对比</button>
            </div>
          </div>`;
      }
      html += '</div>';
    }
    el.innerHTML = html;
    // 绑定卡片跳转
    el.querySelectorAll('.kw-card').forEach(card => {
      const platform = card.dataset.platform;
      const keyword = card.dataset.keyword;
      card.querySelector('.ov-results').onclick = () => {
        $('rPlatform').value = platform;
        loadResultKeywords(platform).then(() => {
          $('rKeyword').value = keyword;
          loadResults();
          switchView('results');
        });
      };
      card.querySelector('.ov-compare').onclick = () => {
        $('cPlatform').value = platform;
        loadCompareKeywords(platform).then(() => {
          $('cKeyword').value = keyword;
          loadSnapshots();
          switchView('compare');
        });
      };
    });
  } catch (e) {
    el.innerHTML = `<div class="empty">加载失败: ${escapeHtml(e.message)}</div>`;
  }
}

// ---------- 结果页 ----------
async function loadResultKeywords(platform) {
  const p = platform || $('rPlatform').value;
  try {
    const data = await api('/api/analyses');
    const info = data[p] || {keywords: []};
    const sel = $('rKeyword');
    sel.innerHTML = '';
    if (!info.keywords.length) {
      sel.innerHTML = '<option value="">无数据</option>';
      return;
    }
    for (const kw of info.keywords) {
      const opt = document.createElement('option');
      opt.value = kw.keyword;
      opt.textContent = `${kw.keyword} (${kw.task_count}任务)`;
      sel.appendChild(opt);
    }
  } catch (e) {
    $('rKeyword').innerHTML = `<option value="">加载失败</option>`;
  }
}

async function loadResults() {
  const el = $('resultsContent');
  el.innerHTML = '<div class="empty">加载中...</div>';
  const platform = $('rPlatform').value;
  const keyword = $('rKeyword').value;
  const analysis = $('rAnalysis').value;
  if (!keyword) { el.innerHTML = '<div class="empty">请选择关键词</div>'; return; }
  try {
    const data = await api(`/api/results/${platform}?keyword=${encodeURIComponent(keyword)}&analysis=${analysis}`);
    if (!data.items.length) {
      el.innerHTML = '<div class="empty">该关键词暂无排行数据</div>';
      return;
    }
    let html = `<div style="margin:8px 0 14px;color:var(--muted);font-size:13px;">${escapeHtml(data.platform_name)} · ${escapeHtml(keyword)} · ${analysis === 'value' ? '价值分析' : '动量分析'} · 共 ${data.count} 条</div>`;
    html += '<div class="card-grid">';
    data.items.forEach((it, i) => {
      const rank = i + 1;
      const growth = it.growth_pct;
      const growthHtml = growth === null || growth === undefined
        ? '<span class="vc-growth none">首次采集</span>'
        : `<span class="vc-growth up">↗ ${growth > 0 ? '+' : ''}${Number(growth).toFixed(1)}%</span>`;
      const url = it.url ? `<a class="vc-link" href="${escapeHtml(it.url)}" target="_blank" rel="noopener noreferrer">打开 ↗</a>` : '';
      const title = it.url
        ? `<a class="vc-title-link" href="${escapeHtml(it.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(it.title)}</a>`
        : escapeHtml(it.title);
      html += `
        <div class="video-card">
          <div class="vc-top">
            <div class="vc-rank ${rank <= 3 ? 'top' : ''}">${rank}</div>
            <span class="vc-platform">${escapeHtml(data.platform_name)}</span>
          </div>
          <div class="vc-title">${title}</div>
          <div class="vc-meta">${escapeHtml(it.author || '未知作者')}</div>
          <div class="vc-meta">首次收录：${fmtDateTime(it.first_seen_at) || '-'}</div>
          <div class="vc-stats">
            <span class="vc-stat">🔥 <b>${fmtNum(it.metric_value)}</b></span>
            <span class="vc-stat">📅 ${fmtDate(it.pubdate)}</span>
          </div>
          <div class="vc-score-row">
            <span class="vc-score-label">${analysis === 'value' ? '价值分' : '动量分'}</span>
            <div class="vc-score-bar"><div class="vc-score-fill" style="width:${Math.min(100, (it.score || 0) * 100)}%"></div></div>
            <span class="vc-score-val">${Number(it.score || 0).toFixed(3)}</span>
          </div>
          ${growthHtml}
          <div class="vc-detail-tabs">
            <button class="vc-detail-tab active" data-target="history">历史指标</button>
            <button class="vc-detail-tab" data-target="algorithm">算法明细</button>
          </div>
          <div class="vc-detail-panel" data-panel="history">${renderHistory(it.history, it.hidden_history_days, platform, it.id)}</div>
          <div class="vc-detail-panel hidden" data-panel="algorithm">${renderAlgorithm(it.algorithm)}</div>
          ${it.tags ? `<div class="vc-tags">${it.tags.split(',').slice(0,3).map(t => `<span class="vc-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${url}
        </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
    initResultCardDetails(el);
  } catch (e) {
    el.innerHTML = `<div class="empty">加载失败: ${escapeHtml(e.message)}</div>`;
  }
}

$('rPlatform').onchange = () => loadResultKeywords();
$('rLoadBtn').onclick = loadResults;

// ---------- 对比页 ----------
async function loadCompareKeywords(platform) {
  const p = platform || $('cPlatform').value;
  try {
    const data = await api('/api/analyses');
    const info = data[p] || {keywords: []};
    const sel = $('cKeyword');
    sel.innerHTML = '';
    for (const kw of info.keywords) {
      const opt = document.createElement('option');
      opt.value = kw.keyword;
      opt.textContent = `${kw.keyword} (${kw.task_count}任务)`;
      sel.appendChild(opt);
    }
    if (info.keywords.length) {
      sel.value = info.keywords[0].keyword;
      loadSnapshots();
    } else {
      $('cSnapA').innerHTML = '<option value="">无数据</option>';
      $('cSnapB').innerHTML = '<option value="">无数据</option>';
    }
  } catch (e) {
    $('cKeyword').innerHTML = `<option value="">加载失败</option>`;
  }
}

async function loadSnapshots() {
  const platform = $('cPlatform').value;
  const keyword = $('cKeyword').value;
  if (!keyword) return;
  try {
    const data = await api(`/api/snapshots/${platform}?keyword=${encodeURIComponent(keyword)}`);
    const snaps = data.snapshots || [];
    const selA = $('cSnapA');
    const selB = $('cSnapB');
    selA.innerHTML = ''; selB.innerHTML = '';
    if (!snaps.length) {
      selA.innerHTML = '<option value="">无可对比快照</option>';
      selB.innerHTML = '<option value="">无可对比快照</option>';
      return;
    }
    for (const s of snaps) {
      const label = `任务${s.task_id} · ${fmtDateTime(s.created_at)} · ${s.video_count}条`;
      const oa = document.createElement('option'); oa.value = s.task_id; oa.textContent = label;
      const ob = document.createElement('option'); ob.value = s.task_id; ob.textContent = label;
      selA.appendChild(oa); selB.appendChild(ob);
    }
    // 默认 A 选最旧、B 选最新
    selA.value = snaps[snaps.length - 1].task_id;
    selB.value = snaps[0].task_id;
  } catch (e) {
    $('cSnapA').innerHTML = '<option value="">加载失败</option>';
    $('cSnapB').innerHTML = '<option value="">加载失败</option>';
  }
}

$('cPlatform').onchange = () => loadCompareKeywords();
$('cKeyword').onchange = loadSnapshots;

$('cCompareBtn').onclick = async () => {
  const el = $('compareContent');
  el.innerHTML = '<div class="empty">对比中...</div>';
  const platform = $('cPlatform').value;
  const keyword = $('cKeyword').value;
  const a = $('cSnapA').value;
  const b = $('cSnapB').value;
  if (!a || !b) { el.innerHTML = '<div class="empty">请选择两个快照</div>'; return; }
  if (a === b) { el.innerHTML = '<div class="empty">请选择两个不同的快照</div>'; return; }
  try {
    const data = await api(`/api/snapshots/${platform}/compare?keyword=${encodeURIComponent(keyword)}&a=${a}&b=${b}`);
    const sa = data.snapshot_a, sb = data.snapshot_b;
    const added = data.added || [], removed = data.removed || [], changed = data.changed || [];

    let html = `<div class="compare-summary">
      <div class="cmp-stat"><div class="num">${sa.count}</div><div class="label">快照A: 任务${sa.task_id} · ${fmtDateTime(sa.created_at)}</div></div>
      <div class="cmp-stat"><div class="num">${sb.count}</div><div class="label">快照B: 任务${sb.task_id} · ${fmtDateTime(sb.created_at)}</div></div>
      <div class="cmp-stat blue"><div class="num">${changed.length}</div><div class="label">📈 都有（增长对比）</div></div>
      <div class="cmp-stat green"><div class="num">${added.length}</div><div class="label">🆕 B新增</div></div>
      <div class="cmp-stat red"><div class="num">${removed.length}</div><div class="label">❌ A消失</div></div>
    </div>`;

    // 增长组
    html += `<div class="cmp-group"><h3>📈 共同视频增长 <span class="count-badge">${changed.length}</span></h3>`;
    if (!changed.length) html += '<div class="empty">两个快照没有共同视频（可能是不同搜索批次）</div>';
    for (const it of changed) {
      const g = it.growth_pct;
      const gCls = (g !== null && g !== undefined && g >= 0) ? 'growth-up' : 'growth-down';
      const gTxt = g === null || g === undefined ? '首次' : `${g > 0 ? '+' : ''}${Number(g).toFixed(1)}%`;
      html += `<div class="cmp-item changed">
        <div class="ci-main">
          <div class="ci-title">${escapeHtml(it.title)}</div>
          <div class="ci-meta">${escapeHtml(it.author || '')}${it.url ? ` · <a href="${escapeHtml(it.url)}" target="_blank" style="color:var(--accent)">链接</a>` : ''}</div>
        </div>
        <div class="ci-value">
          <span class="ci-old">${fmtNum(it.metric_a)}</span><span class="ci-arrow">→</span>
          <span class="num">${fmtNum(it.metric_b)}</span>
          <div class="${gCls}">${gTxt}</div>
        </div>
      </div>`;
    }
    html += '</div>';

    // 新增组
    html += `<div class="cmp-group"><h3>🆕 快照B 新增 <span class="count-badge">${added.length}</span></h3>`;
    if (!added.length) html += '<div class="empty">无新增</div>';
    for (const it of added) {
      html += `<div class="cmp-item added">
        <div class="ci-main">
          <div class="ci-title">${escapeHtml(it.title)}</div>
          <div class="ci-meta">${escapeHtml(it.author || '')}${it.url ? ` · <a href="${escapeHtml(it.url)}" target="_blank" style="color:var(--accent)">链接</a>` : ''}</div>
        </div>
        <div class="ci-value"><span class="num">${fmtNum(it.metric)}</span></div>
      </div>`;
    }
    html += '</div>';

    // 消失组
    html += `<div class="cmp-group"><h3>❌ 快照A 消失 <span class="count-badge">${removed.length}</span></h3>`;
    if (!removed.length) html += '<div class="empty">无消失</div>';
    for (const it of removed) {
      html += `<div class="cmp-item removed">
        <div class="ci-main">
          <div class="ci-title">${escapeHtml(it.title)}</div>
          <div class="ci-meta">${escapeHtml(it.author || '')}${it.url ? ` · <a href="${escapeHtml(it.url)}" target="_blank" style="color:var(--accent)">链接</a>` : ''}</div>
        </div>
        <div class="ci-value"><span class="num">${fmtNum(it.metric)}</span></div>
      </div>`;
    }
    html += '</div>';

    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="empty">对比失败: ${escapeHtml(e.message)}</div>`;
  }
};

// ---------- 表单 ----------
async function loadKeywordHistory() {
  try {
    const data = await api('/api/analyses');
    const info = data[$('platform').value] || {keywords: []};
    for (const kw of info.keywords) {
      const option = document.createElement('option');
      option.value = kw.keyword;
      option.textContent = `${kw.keyword} (${kw.task_count}次)`;
    }
  } catch (_) {
  }
}

// Chrome 风格：历史记录属于输入框本身，聚焦或输入时显示匹配建议。
window.keywordHistoryItems = [];
function closeKeywordSuggestions() {
  $('keywordSuggestions').classList.remove('open');
}
function renderKeywordSuggestions() {
  const input = $('keyword');
  const query = input.value.trim().toLowerCase();
  const items = window.keywordHistoryItems.filter(item =>
    !query || item.keyword.toLowerCase().includes(query));
  $('keywordSuggestions').innerHTML = items.map(item =>
    `<div class="keyword-suggestion" role="option" data-keyword="${escapeHtml(item.keyword)}"><span>${escapeHtml(item.keyword)}</span><span class="keyword-suggestion-count">${item.task_count}次</span></div>`
  ).join('');
  $('keywordSuggestions').classList.toggle('open', items.length > 0 && document.activeElement === input);
}
loadKeywordHistory = async function() {
  const data = await api('/api/analyses');
  window.keywordHistoryItems = (data[$('platform').value] || {keywords: []}).keywords || [];
  renderKeywordSuggestions();
};
$('keywordSuggestions').onclick = e => {
  const item = e.target.closest('.keyword-suggestion');
  if (!item) return;
  $('keyword').value = item.dataset.keyword;
  closeKeywordSuggestions();
  $('keyword').focus();
};
$('keyword').onfocus = renderKeywordSuggestions;
$('keyword').oninput = renderKeywordSuggestions;
$('keyword').onblur = () => setTimeout(closeKeywordSuggestions, 120);

$('platform').onchange = () => {
  const p = $('platform').value;
  $('modeRow').style.display = p === 'bili' ? '' : 'none';
  loadKeywordHistory();
};

$('startBtn').onclick = async () => {
  const platform = $('platform').value;
  const keyword = $('keyword').value.trim();
  const pages = parseInt($('pages').value, 10) || 3;
  const mode = $('mode').value;
  if (!keyword) { alert('请输入关键词'); return; }
  $('startBtn').disabled = true;
  $('startBtn').textContent = '⏳ 启动中...';
  try {
    const task = await api('/api/crawl', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({platform, keyword, pages, mode}),
    });
    await refreshTasks();
    subscribe(task.id);
  } catch (e) {
    alert('启动失败: ' + e.message);
  } finally {
    $('startBtn').disabled = false;
    $('startBtn').textContent = '▶ 开始爬取';
  }
};

// 回车提交
$('keyword').onkeydown = e => { if (e.key === 'Enter') $('startBtn').click(); };

// 清空终端
$('clearTerm').onclick = () => {
  $('termBody').innerHTML = '';
};

// 自动滚动开关
$('autoScrollBtn').onclick = () => {
  autoScroll = !autoScroll;
  $('autoScrollBtn').textContent = '自动滚动: ' + (autoScroll ? '开' : '关');
};

// ---------- 心跳 ----------
async function health() {
  try {
    await api('/api/health');
    $('healthDot').style.background = 'var(--green)';
    $('healthText').textContent = '服务在线';
  } catch (e) {
    $('healthDot').style.background = 'var(--red)';
    $('healthText').textContent = '服务离线';
  }
}

// 轮询任务列表（运行中 1s，否则 3s）
setInterval(() => {
  health();
  const running = Object.values(tasksMap).some(t => t.status === 'running' || t.status === 'starting');
  refreshTasks();
}, running ? 1000 : 3000);

// 启动
health();
refreshTasks();
loadKeywordHistory();
</script>
